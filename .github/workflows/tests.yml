name: tests

# Runs the whole test suite on every push and pull request.
# The project has no dependencies, so there is no install step and nothing to cache.
# The tests use saved API responses, so they need no secrets and make no network calls.

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code. Without this line it would get a broader default token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA (the comment shows the version), so a moved or
      # hijacked tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test
